<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricerca CNO / POP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0078d4;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:10px;
}

.result{
    margin-top:20px;
    display:none;
    padding:15px;
    background:#f8f8f8;
    border-radius:10px;
}

.info{
    margin:10px 0;
}

.btn{
    display:block;
    width:100%;
    margin-top:15px;
    background:#0078d4;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:10px;
    font-weight:bold;
}

.notfound{
    color:red;
    margin-top:15px;
    display:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 Ricerca CNO / POP</h1>

<input
id="search"
type="text"
placeholder="Inserisci codice (es. D247_CNO3 o MIEXA)"
autocomplete="off">

<div id="notfound" class="notfound">
Codice non trovato
</div>

<div id="result" class="result">

<h2 id="nome"></h2>

<div id="tipo" class="info"></div>

<div id="coord" class="info"></div>

<a id="maps" class="btn" target="_blank">
Apri Google Maps
</a>

</div>

</div>

<script>

let database = {};

async function caricaFile(nomeFile,tipo){

    const response = await fetch(nomeFile);
    const testo = await response.text();

    const righe = testo.split(/\r?\n/);

    for(let i=1;i<righe.length;i++){

        const riga = righe[i].trim();

        if(!riga) continue;

        const parti = riga.split(/\s+/);

const parti = riga.split(/\s+/);

if(parti.length < 2) continue;

const codice = parti[0].trim().toUpperCase();

const coord = parti[1].trim();

database[codice] = {
    tipo: tipo,
    coord: coord
};

 

async function inizializza(){

    await Promise.all([
        caricaFile("CoordinatePOP.CSV","POP"),
        caricaFile("CoordinateCNO.CSV","CNO")
    ]);

    console.log("Record caricati:",
    Object.keys(database).length);
}

inizializza();

document.getElementById("search")
.addEventListener("input",function(){

    const codice =
    this.value.trim().toUpperCase();

    const dato = database[codice];

    if(!dato){

        document.getElementById("result")
        .style.display="none";

        document.getElementById("notfound")
        .style.display =
        codice.length > 1 ? "block" : "none";

        return;
    }

    document.getElementById("nome")
    .innerText = codice;

    document.getElementById("tipo")
    .innerText = "Tipo: " + dato.tipo;

    document.getElementById("coord")
    .innerText = "Coordinate: " + dato.coord;

document.getElementById("maps").href =
"https://www.google.com/maps?q=" +
encodeURIComponent(dato.coord);

    document.getElementById("result")
    .style.display="block";

    document.getElementById("notfound")
    .style.display="none";

});

</script>

</body>
</html>
