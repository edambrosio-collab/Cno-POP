<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricerca CNO / POP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#0078d4;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:10px;
}

.result{
    margin-top:20px;
    display:none;
    padding:15px;
    background:#f8f8f8;
    border-radius:10px;
}

.info{
    margin:10px 0;
    word-break:break-word;
}

.btn{
    display:block;
    width:100%;
    margin-top:15px;
    padding:15px;
    background:#0078d4;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

.notfound{
    margin-top:15px;
    color:red;
    display:none;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h1>📍 Ricerca CNO / POP</h1>

<input
id="search"
type="text"
placeholder="Inserisci codice (es. MIEXA o D247_CNO3)"
autocomplete="off">

<div class="notfound" id="notfound">
Codice non trovato
</div>

<div class="result" id="result">

<h2 id="nome"></h2>

<div class="info" id="tipo"></div>

<div class="info" id="coord"></div>

<a
id="maps"
class="btn"
target="_blank">
Apri Google Maps
</a>

</div>

</div>

<script>

let database = {};

async function caricaFile(nomeFile,tipo){

    const response = await fetch(nomeFile);
    const testo = await response.text();

    const righe = testo.split(/\r?\n/);

    for(let i=1;i<righe.length;i++){

        const riga = righe[i].trim();

        if(!riga) continue;

        const parti = riga.split(/\s+/);

        if(parti.length < 3) continue;

        const codice = parti[0].toUpperCase();

        const lat = parti[1].replace(",",".");
        const lon = parti[2].replace(",",".");

        database[codice] = {
            tipo: tipo,
            coord: lat + "," + lon
        };
    }
}

async function inizializza(){

    await Promise.all([
        caricaFile("CoordinatePOP.CSV","POP"),
        caricaFile("CoordinateCNO.CSV","CNO")
    ]);

    console.log("Record caricati:",Object.keys(database).length);
}

inizializza();

document
.getElementById("search")
.addEventListener("input",function(){

    const valore = this.value.trim().toUpperCase();

    const result = document.getElementById("result");
    const notfound = document.getElementById("notfound");

    if(valore.length < 2){
        result.style.display="none";
        notfound.style.display="none";
        return;
    }

    if(database[valore]){

        const dato = database[valore];

        document.getElementById("nome").innerText =
        valore;

        document.getElementById("tipo").innerText =
        "Tipo: " + dato.tipo;

        document.getElementById("coord").innerText =
        "Coordinate: " + dato.coord;

        document.getElementById("maps").href =
        "https://www.google.com/maps?q=" +
        dato.coord;

        result.style.display="block";
        notfound.style.display="none";
    }
    else{

        result.style.display="none";
        notfound.style.display="block";
    }

});

</script>

</body>
</html>
