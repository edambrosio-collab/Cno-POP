<script>

let database = {};

async function caricaFile(nomeFile,tipo){

    const response = await fetch(nomeFile);
    const testo = await response.text();

    const righe = testo.split(/\r?\n/);

    for(let i=1;i<righe.length;i++){

        const riga = righe[i].trim();

        if(!riga) continue;

        const parti = riga.split(/\s+/);

        if(parti.length < 3) continue;

        const codice = parti[0].trim().toUpperCase();

        const lat = parseFloat(parti[1].replace(",","."));
        const lon = parseFloat(parti[2].replace(",","."));

        if(isNaN(lat) || isNaN(lon)) continue;

        database[codice] = {
            tipo: tipo,
            coord: lat + "," + lon
        };
    }
}

async function inizializza(){

    await Promise.all([
        caricaFile("CoordinatePOP.CSV","POP"),
        caricaFile("CoordinateCNO.CSV","CNO")
    ]);

    console.log("Record caricati:", Object.keys(database).length);
}

inizializza();

document.getElementById("search")
.addEventListener("input", function(){

    const valore = this.value.trim().toUpperCase();

    const result = document.getElementById("result");
    const notfound = document.getElementById("notfound");

    if(valore.length < 2){
        result.style.display = "none";
        notfound.style.display = "none";
        return;
    }

    if(database[valore]){

        const dato = database[valore];

        document.getElementById("nome").innerText = valore;
        document.getElementById("tipo").innerText = "Tipo: " + dato.tipo;
        document.getElementById("coord").innerText = "Coordinate: " + dato.coord;

        document.getElementById("maps").href =
            "https://www.google.com/maps?q=" +
            encodeURIComponent(dato.coord);

        result.style.display = "block";
        notfound.style.display = "none";

    } else {

        result.style.display = "none";
        notfound.style.display = "block";
    }

});

</script>
